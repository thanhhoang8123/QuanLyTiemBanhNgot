spring.application.name=QuanLyTiemBanhNgot

spring.datasource.url=jdbc:mysql://localhost:3306/quanlytiembanhngot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.mongodb.database=quanlytiembanh_logs
spring.mongodb.uri=mongodb://localhost:27017/quanlytiembanh_logs
spring.data.mongodb.auto-index-creation=true
