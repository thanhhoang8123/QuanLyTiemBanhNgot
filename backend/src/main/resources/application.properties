spring.application.name=QuanLyTiemBanhNgot

spring.datasource.url=jdbc:mysql://localhost:3306/quanlytiembanhngot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.mongodb.database=quanlytiembanh_logs
spring.mongodb.uri=mongodb://localhost:27017/quanlytiembanh_logs
spring.data.mongodb.auto-index-creation=false

# Cloudinary là tùy chọn khi chạy backend; upload cần đủ cả ba biến môi trường.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Gioi han dung luong file upload
spring.servlet.multipart.max-file-size=6MB

# Gioi han tong dung luong moi request upload
spring.servlet.multipart.max-request-size=7MB