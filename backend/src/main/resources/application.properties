spring.application.name=QuanLyTiemBanhNgot
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway vẫn quản lý các môi trường không dùng profile dev.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20261011
spring.flyway.locations=classpath:db/migration

spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.mongodb.database=quanlytiembanh_logs
spring.data.mongodb.auto-index-creation=false

# Cloudinary là tùy chọn khi chạy backend; upload cần đủ cả ba biến môi trường.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}




# Gioi han dung luong file upload
spring.servlet.multipart.max-file-size=6MB

# Gioi han tong dung luong moi request upload
spring.servlet.multipart.max-request-size=7MB
# Gmail SMTP: dùng Gmail App Password, không dùng mật khẩu Gmail thông thường.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
shop.contact.recipient=${SHOP_CONTACT_EMAIL:}
# Sao chep cac dong nay vao application.properties (hoac profile dung cho production).
# HTTPS production: dat secure=true; localhost HTTP can de false khi phat trien.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m


# VNPay Sandbox
# VNPay Sandbox
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=${VNPAY_PAYMENT_URL:}
vnpay.query-url=${VNPAY_QUERY_URL:}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.ipn-url=${VNPAY_IPN_URL:}

# Bat mo phong thanh toan POS / Thu ngan
app.payment-simulation.enabled=true
