spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Spring Boot 4.1.1 MongoProperties binds spring.mongodb.uri to the actual MongoClient.
spring.mongodb.uri=${MONGODB_URI:}
spring.mongodb.database=quanlytiembanh_logs
spring.data.mongodb.auto-index-creation=false

# Production must not run migrations or create a Flyway baseline on application startup.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false

server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m

# Allow only the deployed shop origin for credentialed CORS requests.
app.frontend-url=${FRONTEND_URL:https://quanlytiembanhngot.onrender.com}
shop.contact.recipient=${SHOP_CONTACT_EMAIL:}
app.payment-simulation.enabled=false

# Cloudinary là tùy chọn khi chạy backend; upload cần đủ cả ba biến môi trường.
